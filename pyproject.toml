[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aifactory-twin"
version = "0.2.0"
description = "AI infrastructure, GPU and network optimization across Azure, CloudStack, VMware, Proxmox, Docker and Kubernetes"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aifactory-twin = "aifactory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
